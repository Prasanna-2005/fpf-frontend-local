services:
  web:
    ports:
      - "80:80"
      - "443:443"
    volumes:
          - ../../nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

          # Mount SSL files
          - ../../ssl/ssl.crt:/etc/nginx/ssl/ssl.crt:ro
          - ../../ssl/ssl.key:/etc/nginx/ssl/ssl.key:ro

    environment:
      - NODE_ENV=production
